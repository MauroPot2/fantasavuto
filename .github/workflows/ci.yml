name: Fantasavuto CI

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Dart
        uses: dart-lang/setup-dart@v1
        with:
          sdk: stable

      - name: Install Dart dependencies
        run: dart pub get

      - name: Analyze Dart
        run: dart analyze

      - name: Check JavaScript syntax
        run: |
          node --check web/firebase-app.js
          node --check web/cms-app.js
          node --check web/cms-v2.js
          node --check web/cms-v2-overrides.js
          node --check web/cms-v2-storage-fix.js
          node --check web/sponsor-cache-migration.js
          node --check web/sponsor-image-optimization.js
          node --check web/sponsor-dock-sync.js
          node --check web/site-utils.js
          node --check web/cookie-consent.js
          node --check web/analytics-events.js
          node --check web/seo-structured-data.js
          node --check tool/postprocess-sitemap.mjs

      - name: Run JavaScript tests
        run: node --test test/site-utils.test.mjs

      - name: Build Jaspr static site
        run: dart run jaspr_cli:jaspr build --sitemap-domain https://fantasavuto.web.app

      - name: Clean sitemap for search engines
        run: npm run seo:sitemap

      - name: Verify SEO output
        run: |
          test -f build/jaspr/index.html
          test -f build/jaspr/sitemap.xml
          test -f build/jaspr/robots.txt
          grep -q 'Sitemap: https://fantasavuto.web.app/sitemap.xml' build/jaspr/robots.txt
          grep -q '<loc>https://fantasavuto.web.app/regolamento</loc>' build/jaspr/sitemap.xml
          ! grep -q '<loc>https://fantasavuto.web.app/admin</loc>' build/jaspr/sitemap.xml
          ! grep -q '<loc>https://fantasavuto.web.app/competizioni/dettaglio</loc>' build/jaspr/sitemap.xml
